name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore CivSim2.sln
      - name: Build
        run: dotnet build CivSim2.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CivSim2.sln --configuration Release --no-build
